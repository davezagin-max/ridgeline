[project]
name = "ridgeline-tools"
version = "0.1.0"
description = "Builds the compact Wasatch heightmap that the Ridgeline web app ships with."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["terrain"]
ignore_missing_imports = true
check_untyped_defs = true
